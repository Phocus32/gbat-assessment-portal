services:
  gbat:
    build: .
    image: gbat-assessment-portal:local
    container_name: gbat-assessment-portal
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      SQLITE_PATH: /app/data/gbat.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SEED_DEMO: ${SEED_DEMO:-true}
      # Optional: set a fixed first-run password instead of a generated one.
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-me-to-a-long-password
      # JWT_SECRET: replace-with-at-least-32-random-characters
    volumes:
      - gbat-data:/app/data
    restart: unless-stopped

volumes:
  gbat-data:
