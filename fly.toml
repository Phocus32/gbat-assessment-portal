# Change `app` to a globally unique name before the first deploy.
app = "gbat-assessment-portal"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATA_DIR = "/data"
  SQLITE_PATH = "/data/gbat.db"
  TRUST_PROXY = "true"
  COOKIE_SECURE = "true"

# Create this volume once: fly volumes create gbat_data --size 1 --region iad
[[mounts]]
  source = "gbat_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
